name: Package integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tarball:
    name: Install from a packed tarball
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The whole check lives in scripts/verify-package.mjs so that it runs
      # identically here, in the release workflow, and on a contributor's
      # laptop. It packs the tarball, installs it into a throwaway project, and
      # drives the CLI with the registry made unreachable - without that, every
      # assertion would silently pass by downloading a published copy of the
      # package instead of testing the one just built.
      - name: Build
        run: npm run build

      - name: Verify the packed package
        shell: bash
        run: npm run verify:package

  action-bundle:
    name: Action bundle is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Rebuild the action bundle
        run: npm run build:action

      - name: Fail if the committed bundle differs
        run: |
          if ! git diff --exit-code -- action/dist; then
            echo "::error::action/dist is out of date. Run 'npm run build:action' and commit the result."
            exit 1
          fi
