name: Self scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  shipcheck:
    name: Shipcheck scans itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run AI Shipcheck on this repository
        id: shipcheck
        uses: ./
        with:
          path: .
          fail-on: high

      - name: Upload the SARIF report to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.shipcheck.outputs.sarif-file }}
          category: ai-shipcheck
